<!-- backend/templates/dashboard.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FinanceBot Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .chart-container { width: 90%; max-width: 900px; margin: auto; }
  </style>
</head>
<body>
  <h2>داشبورد مالی - کاربر {{ user_id }}</h2>
  <div class="chart-container">
    <canvas id="incomeExpenseChart"></canvas>
  </div>

  <script>
    const userId = {{ user_id }};
    async function fetchChart() {
      const resp = await fetch(`/api/transactions/chart/${userId}`);
      const data = await resp.json();
      return data;
    }

    function renderChart(data) {
      const ctx = document.getElementById('incomeExpenseChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [
            { label: 'درآمد', data: data.income, fill: false, tension: 0.1 },
            { label: 'هزینه', data: data.expense, fill: false, tension: 0.1 }
          ]
        },
        options: {
          responsive: true,
          scales: { x: { display: true }, y: { display: true } }
        }
      });
    }

    (async () => {
      const data = await fetchChart();
      renderChart(data);
    })();
  </script>
</body>
</html>
